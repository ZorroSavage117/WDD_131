
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Week 4 Responsive Menu">
    <title>Responsive Menu</title>

    <link rel="stylesheet" href="week4ponder_2.css">
    <script src="week4ponder_2.js" defer></script>
</head>

<body>
    <header>
        <h1>Responsive Menu</h1>

        <button class="menu-btn" aria-label="Toggle menu" aria-expanded="false">
            <span class="bar1"></span>
            <span class="bar2"></span>
            <span class="bar3"></span>
        </button>

        <nav class="hide">
            <a href="#">Home</a>
            <a href="#">People</a>
            <a href="#">Places</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Welcome!</h2>
        <p>Resize the browser window to see how the responsive menu changes.</p>
        <p>On smaller screens, click the menu button to show or hide the navigation links.</p>
    </main>

    <footer>
        <p>© 2026 Responsive Menu</p>
    </footer>
</body>
</html>
