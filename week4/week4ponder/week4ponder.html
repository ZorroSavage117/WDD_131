
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Week 4 Responsive Gallery with Modals">
    <title>Week 4 Ponder - Gallery</title>

    <link rel="stylesheet" href="week4ponder.css">
    <script src="week4ponder.js" defer></script>
</head>

<body>
    <h1>Gallery</h1>

    <section class="gallery">
        <figure>
            <img src="images/book-sm.jpg" alt="person reading a book">
        </figure>
        <figure>
            <img src="images/couch-sm.jpg" alt="person sitting on a couch with a phone">
        </figure>
        <figure>
            <img src="images/desk-sm.jpg" alt="a work desktop">
        </figure>
        <figure>
            <img src="images/keyboard-sm.jpg" alt="person typing on a keyboard">
        </figure>
        <figure>
            <img src="images/phone-sm.jpg" alt="person looking at a phone">
        </figure>
        <figure>
            <img src="images/sit-sm.jpg" alt="person sitting on a couch">
        </figure>
    </section>

    <dialog>
        <img alt="Enlarged gallery image">
        <button class="close-viewer" aria-label="Close image">X</button>
    </dialog>
</body>
</html>
